[project]
name = "openwind"
version = "1.0.0"
description = "Marine weather map built from free public forecast models (GFS, ECMWF, DWD ICON and their wave models)"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "eccodes>=2.50.0",
    "eccodeslib>=2.50.0.32",
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
# Starlette's test client wants httpx2; httpx still works and is what the app itself uses.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
# pyflakes, pycodestyle, import order, bugbear, pyupgrade, simplify, comprehensions
select = ["F", "E", "W", "I", "B", "UP", "SIM", "C4"]
ignore = ["B905"]  # zip() without strict=: the zips here pair arrays built together
