# OpenWind: the ingest worker, the API and the web server. See docs/operations.md.
#   docker compose up -d --build
# Hardened per the CIS Docker benchmark: pinned images, non-root users, read-only root filesystems,
# no capabilities, no privilege escalation, memory and process limits.
x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  ingest:
    <<: *hardened
    build: .
    image: openwind-app
    command: python -m openwind.ingest --loop
    volumes: ["./data:/data"]
    tmpfs: ["/tmp:size=512m"]
    mem_limit: 6g
    pids_limit: 128
  api:
    <<: *hardened
    image: openwind-app
    # --proxy-headers: the client address comes from Caddy's X-Forwarded-For. The API port is only reachable
    # from the web container (it is never published), so the header can be trusted.
    command: uvicorn openwind.api:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=* --no-server-header --no-access-log --timeout-keep-alive 5
    volumes: ["./data:/data:ro"]
    tmpfs: ["/tmp:size=256m"]
    depends_on: [ingest]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 3g
    pids_limit: 128
  web:
    <<: *hardened
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    user: "1000:1000"
    cap_add: [NET_BIND_SERVICE]  # only so the image's setcap caddy binary may exec; nothing runs as root
    # Published on this machine only. Change to "8080:8080" (or put your own reverse proxy in front) to serve others.
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web/dist:/srv:ro
      - ./data/runs:/runs:ro
      - ./data/basemap:/basemap:ro
    tmpfs: ["/data:uid=1000,gid=1000,mode=0700,size=16m", "/config:uid=1000,gid=1000,mode=0700,size=16m"]
    depends_on: [api]
    mem_limit: 512m
    pids_limit: 128
